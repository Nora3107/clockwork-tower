<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Favicon: banh rang dong ho mau dong, bieu tuong cua The Clockwork Tower -->
  <rect width="64" height="64" rx="12" fill="#0b0e13"/>
  <g fill="#d9a441">
    <!-- Rang cua quanh vanh -->
    <g>
      <rect x="29" y="6"  width="6" height="9" rx="1"/>
      <rect x="29" y="49" width="6" height="9" rx="1"/>
      <rect x="6"  y="29" width="9" height="6" rx="1"/>
      <rect x="49" y="29" width="9" height="6" rx="1"/>
      <rect x="12" y="12" width="6" height="9" rx="1" transform="rotate(-45 15 16.5)"/>
      <rect x="46" y="43" width="6" height="9" rx="1" transform="rotate(-45 49 47.5)"/>
      <rect x="46" y="12" width="6" height="9" rx="1" transform="rotate(45 49 16.5)"/>
      <rect x="12" y="43" width="6" height="9" rx="1" transform="rotate(45 15 47.5)"/>
    </g>
    <!-- Vanh banh rang -->
    <circle cx="32" cy="32" r="20" fill="none" stroke="#d9a441" stroke-width="6"/>
  </g>
  <!-- Kim dong ho dung yen: thoi gian dang bi dong bang -->
  <g stroke="#7cf0ff" stroke-width="3" stroke-linecap="round">
    <line x1="32" y1="32" x2="32" y2="20"/>
    <line x1="32" y1="32" x2="41" y2="36"/>
  </g>
  <circle cx="32" cy="32" r="3.5" fill="#7cf0ff"/>
</svg>
